        font-family="Arial, sans-serif"
        font-size="16"
        font-weight="bold"
        fill="#F0F6FC">
    Explore
  </text>

  <!-- Milestone 4 -->
  <circle cx="740" cy="135" r="28" fill="#6A5ACD"/>
  <text x="740" y="143"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="22"
        fill="white">4</text>

  <text x="740" y="195"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="16"
        font-weight="bold"
        fill="#F0F6FC">
    Grow
  </text>

</svg>
